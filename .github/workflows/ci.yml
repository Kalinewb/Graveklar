name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20, because the test harness needs it:
          #   - tests/e2e/helpers.ts imports `node:sqlite`, added in 22.5.0.
          #     On 20 the import throws at collection time and the nine e2e
          #     suites that use it fail instead of skipping.
          #   - puppeteer-core and @puppeteer/browsers both declare
          #     `node: >=22.12.0`; npm warned EBADENGINE on every install.
          # The Dockerfile still ships node:20-slim. Nothing under src/ uses
          # either dependency, so the runtime is unaffected.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        # Required so @prisma/client types resolve before tsc runs.
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage
        # Enforces the Gate B coverage floors in vitest.config.ts (audit,
        # 2026-09-07): the run fails when a floor is undercut.
        run: npm run test:coverage

      - name: Build
        # Dummy env vars so `next build` doesn't fail on env validation.
        # Mirrors the Dockerfile's build-time stub values.
        env:
          DATABASE_URL: file:/tmp/ci-build.db
          ADMIN_PASSWORD: ci-build-not-used
          ADMIN_SESSION_SECRET: ci-build-not-used
        run: npm run build
